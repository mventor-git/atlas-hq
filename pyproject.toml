[project]
name = "atlas-hq"
version = "0.1.0"
description = "Atlas-HQ — HR-centered modular plugin platform foundation"
requires-python = ">=3.12"
readme = "README.md"
# ponytail: SQLite now; the URL is the only swap needed for Postgres later
# (psycopg is deliberately absent until a server is actually reachable).
dependencies = ["SQLAlchemy>=2.0", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1.350",
]

[project.scripts]
atlas-hq = "atlas_hq.cli:main"

# Gate C — real entry points in the ``atlas.plugins`` group. Discovery reads
# these and nothing else; adding a plugin never touches core (contract section 17).
[project.entry-points."atlas.plugins"]
atlas_demo = "atlas_plugins.atlas_demo:AtlasDemoPlugin"
atlas_demo_consumer = "atlas_plugins.atlas_demo_consumer:AtlasDemoConsumerPlugin"
report_studio = "atlas_plugins.report_studio:ReportStudioPlugin"
workforce_summary = "atlas_plugins.workforce_summary:WorkforceSummaryPlugin"
attendance_summary = "atlas_plugins.attendance_summary:AttendanceSummaryPlugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = "error"
