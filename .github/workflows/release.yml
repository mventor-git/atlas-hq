name: Release

# contract.md 40.4 and 40.6: the tagged release is the only distribution path.
# A tag push is the only trigger. There is no pull_request trigger here, so
# nothing an untrusted fork can change runs with write permission.
on:
  push:
    tags:
      - 'v*'

# Least privilege by default; the release job opts into exactly what it needs.
permissions:
  contents: read

jobs:
  # contract.md 40.5: the packaging gate runs against the tag itself, not against
  # main. A release is not publishable until the tag's own copy of the two
  # scripts parses under Windows PowerShell 5.1, passes tests/windows/
  # verify_scripts.ps1, and dry-runs clean. Nothing here starts a server, a
  # container or a database, and nothing here reads a secret.
  windows-scripts:
    name: Windows scripts for this tag (5.1 parse + dry run)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The tag's own tree: `git archive` and this gate must prove the same
      # commit, or the release publishes something the gate never saw.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Parse every PowerShell script
        run: |
          $ErrorActionPreference = 'Stop'
          $files = 'install.ps1', 'start-demo.ps1', 'tests/windows/verify_scripts.ps1'
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              # Not `$error`: that is the read-only automatic variable.
              foreach ($parseError in $errors) {
                Write-Host "::error file=$file,line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
              }
              throw "$file does not parse"
            }
            Write-Host "[ok] $file parses"
          }
      - name: Windows PowerShell 5.1 packaging gate
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\verify_scripts.ps1
      - name: Both scripts dry-run from the tag
        # The gate's section 5 already dry-runs both; these two steps make the
        # tag's own dry runs a job of their own, so a failure names the script
        # and not a numbered check. The installer is given -SkipChecksum because
        # the tag has no SHA256SUMS.txt asset until this release is published,
        # and the checksum path is proved by the gate against a stub bundle.
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -SkipChecksum -DryRun
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -DryRun failed with $LASTEXITCODE" }
          powershell -NoProfile -ExecutionPolicy Bypass -File start-demo.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw "start-demo.ps1 -DryRun failed with $LASTEXITCODE" }

  release:
    name: Build the release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The one thing the release is not allowed to do without: proof that the
    # tagged scripts work on Windows. Default deny, and a job that cannot skip it.
    needs: windows-scripts
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the source bundle and its checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip="atlas-hq-${VERSION}.zip"
          # `git archive` is the tag's own tracked tree, so the bundle cannot
          # pick up an untracked, ignored, or generated file.
          git archive --format=zip --prefix="atlas-hq-${VERSION}/" --output="$zip" "$GITHUB_SHA"
          # install.ps1 and start-demo.ps1 are already at the workspace root,
          # which is where the release step uploads them from.
          # `sha256sum -c` format, so the installer can verify itself against
          # the file sitting beside it in the release assets.
          sha256sum install.ps1 start-demo.ps1 "$zip" > SHA256SUMS.txt
          # Checksums are not secrets; naming the assets is the point of the log.
          sha256sum --check SHA256SUMS.txt
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # Exactly the four assets contract section 40.6 names.
          files: |
            atlas-hq-*.zip
            install.ps1
            start-demo.ps1
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
